name: Build Windows EXE

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out, dist, build | Out-Null
          $sources = Get-ChildItem -Recurse src -Filter *.java | Select-Object -ExpandProperty FullName
          javac -d out $sources

      - name: Write manifest
        shell: pwsh
        run: |
          @"
          Manifest-Version: 1.0
          Main-Class: exitlag.Main
          Implementation-Title: FiveM Booster
          Implementation-Version: 1.0.0
          "@ | Set-Content -Path build/manifest.txt -NoNewline

      - name: Package fat JAR
        run: jar --create --file dist/FiveMBooster.jar --manifest build/manifest.txt -C out .

      - name: Build Windows app-image via jpackage
        run: >
          jpackage
          --type app-image
          --name "FiveM Booster"
          --app-version 1.0.0
          --vendor "Final Project ASD"
          --input dist
          --main-jar FiveMBooster.jar
          --main-class exitlag.Main
          --dest dist

      - name: Zip app-image for upload
        shell: pwsh
        run: Compress-Archive -Path "dist/FiveM Booster" -DestinationPath "dist/FiveMBooster-windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveMBooster-windows
          path: dist/FiveMBooster-windows.zip

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveMBooster-jar
          path: dist/FiveMBooster.jar
