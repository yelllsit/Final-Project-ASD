name: Build and Release Windows EXE

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show versions
        run: |
          java -version
          javac -version
          jar --version
          jpackage --version

      - name: Compile
        run: |
          mkdir -p out dist build
          find src -name '*.java' > build/sources.txt
          cat build/sources.txt
          javac -d out @build/sources.txt

      - name: Write manifest
        run: |
          printf 'Manifest-Version: 1.0\nMain-Class: exitlag.Main\nImplementation-Title: FiveM Booster\nImplementation-Version: 1.0.0\n' > build/manifest.txt
          cat build/manifest.txt

      - name: Package fat JAR
        run: jar --create --file dist/FiveMBooster.jar --manifest build/manifest.txt -C out .

      - name: Smoke-test JAR loads
        run: unzip -p dist/FiveMBooster.jar META-INF/MANIFEST.MF

      - name: jpackage app-image
        run: |
          jpackage \
            --type app-image \
            --name FiveMBooster \
            --app-version 1.0.0 \
            --vendor "Final Project ASD" \
            --input dist \
            --main-jar FiveMBooster.jar \
            --main-class exitlag.Main \
            --dest dist
          ls -la dist
          ls -la dist/FiveMBooster

      - name: Zip app-image
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path 'FiveMBooster/*' -DestinationPath 'FiveMBooster-windows.zip' -Force"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMBooster-windows
          path: |
            dist/FiveMBooster-windows.zip
            dist/FiveMBooster.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=latest
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 2
          gh release create "$TAG" \
            "dist/FiveMBooster-windows.zip" \
            "dist/FiveMBooster.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FiveM Booster - latest build" \
            --notes "Automatic build from commit $GITHUB_SHA on branch $GITHUB_REF_NAME. Download FiveMBooster-windows.zip, unzip it, and run FiveMBooster/FiveMBooster.exe."
