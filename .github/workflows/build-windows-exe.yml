name: Build and Release Windows EXE

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Diagnostics
        run: |
          set -x
          java -version 2>&1
          javac -version 2>&1
          jar --version
          jpackage --version
          which jpackage
          which 7z || echo "no 7z"
          which zip || echo "no zip"
          which powershell || echo "no powershell"
          uname -a
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la
          ls -la src/exitlag

      - name: Compile
        run: |
          set -euxo pipefail
          mkdir -p out dist build
          find src -name '*.java' > build/sources.txt
          wc -l build/sources.txt
          cat build/sources.txt
          javac -d out @build/sources.txt
          echo "compile OK"
          find out -name '*.class' | head -5

      - name: Package fat JAR
        run: |
          set -euxo pipefail
          printf 'Manifest-Version: 1.0\nMain-Class: exitlag.Main\nImplementation-Title: FiveM Booster\nImplementation-Version: 1.0.0\n' > build/manifest.txt
          cat build/manifest.txt
          mkdir -p input
          jar --create --file input/FiveMBooster.jar --manifest build/manifest.txt -C out .
          cp input/FiveMBooster.jar dist/FiveMBooster.jar
          ls -la input dist
          jar tf input/FiveMBooster.jar | head -10

      - name: jpackage
        run: |
          set -euxo pipefail
          jpackage \
            --type app-image \
            --name FiveMBooster \
            --app-version 1.0.0 \
            --vendor "Final Project ASD" \
            --input input \
            --main-jar FiveMBooster.jar \
            --main-class exitlag.Main \
            --dest dist \
            --verbose 2>&1 | tee build/jpackage.log
          ls -la dist
          ls -la "dist/FiveMBooster"

      - name: Zip via 7z
        run: |
          set -euxo pipefail
          cd dist
          7z a FiveMBooster-windows.zip FiveMBooster
          ls -la

      - name: jpackage Windows installer (.exe)
        run: |
          set -euxo pipefail
          mkdir -p installer
          jpackage \
            --type exe \
            --name FiveMBooster \
            --app-version 1.0.0 \
            --vendor "Final Project ASD" \
            --description "FiveM route optimizer (ExitLag-style)" \
            --input input \
            --main-jar FiveMBooster.jar \
            --main-class exitlag.Main \
            --dest installer \
            --win-menu \
            --win-menu-group "FiveM Booster" \
            --win-shortcut \
            --win-shortcut-prompt \
            --win-dir-chooser \
            --win-per-user-install \
            --verbose 2>&1 | tee build/jpackage-installer.log
          ls -la installer
          mv installer/*.exe dist/FiveMBooster-installer.exe
          ls -la dist

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            build/
            dist/

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMBooster-windows
          path: |
            dist/FiveMBooster-installer.exe
            dist/FiveMBooster-windows.zip
            dist/FiveMBooster.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG=latest
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 3
          gh release create "$TAG" \
            dist/FiveMBooster-installer.exe \
            dist/FiveMBooster-windows.zip \
            dist/FiveMBooster.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FiveM Booster - latest build" \
            --notes "Auto-built from commit ${GITHUB_SHA}.

          **Recommended:** download **FiveMBooster-installer.exe**, run it, follow the wizard (Start Menu shortcut + uninstaller included).

          Alternatives:
          - **FiveMBooster-windows.zip** — portable, unzip and run FiveMBooster/FiveMBooster.exe (no install)
          - **FiveMBooster.jar** — cross-platform JAR, run with java -jar FiveMBooster.jar (needs JDK 17+)"
