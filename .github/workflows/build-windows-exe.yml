name: Build and Release Windows EXE

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          set -euxo pipefail
          java -version
          jpackage --version
          mkdir -p out dist build
          find src -name '*.java' -print0 | xargs -0 javac -d out
          printf 'Manifest-Version: 1.0\nMain-Class: exitlag.Main\nImplementation-Title: FiveM Booster\nImplementation-Version: 1.0.0\n' > build/manifest.txt
          jar --create --file dist/FiveMBooster.jar --manifest build/manifest.txt -C out .
          jpackage \
            --type app-image \
            --name FiveMBooster \
            --app-version 1.0.0 \
            --vendor "Final Project ASD" \
            --input dist \
            --main-jar FiveMBooster.jar \
            --main-class exitlag.Main \
            --dest dist
          ls -la dist
          ls -la dist/FiveMBooster
          (cd dist && 7z a FiveMBooster-windows.zip FiveMBooster/*)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: FiveMBooster-windows
          path: |
            dist/FiveMBooster-windows.zip
            dist/FiveMBooster.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG=latest
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 3
          gh release create "$TAG" \
            dist/FiveMBooster-windows.zip \
            dist/FiveMBooster.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FiveM Booster - latest build" \
            --notes "Auto-built from commit ${GITHUB_SHA}. Download FiveMBooster-windows.zip, unzip it, then run FiveMBooster/FiveMBooster.exe. The JAR is provided as a portable alternative (java -jar FiveMBooster.jar)."
